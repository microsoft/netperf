name: "Run Test Script [NEEDS NETPERF REPO CLONED FIRST]"
description: "This action runs multiple steps as a composite action."
inputs:
  log-profile:
    description: "The logging profile to use for the test."
    type: string
    required: true
  msquic-commit:
    description: "The MsQuic commit or ref to test."
    type: string
    required: true
  environment:
    description: "The test environment."
    type: string
    required: true
  platform:
    description: "The test platform."
    type: string
    required: true
  os:
    description: "The target operating system."
    type: string
    required: true
  arch:
    description: "The target architecture."
    type: string
    required: true
  tls:
    description: "The TLS provider."
    type: string
    required: true
  io:
    description: "The I/O provider."
    type: string
    required: true
  filter:
    description: "The test filter."
    type: string
    required: true
  matrix:
    description: "The serialized matrix of values to use for the composite action."
    type: string
    required: true
  syncer-secret:
    description: "For use to sync with the remote cache."
    type: string
    required: true
runs:
  using: "composite"
  steps:
  - name: Run Windows PowerShell test script
    if: ${{ env.HAS_PWSH == 'false' }}
    shell: cmd
    env:
      NETPERF_MATRIX: ${{ inputs.matrix }}
      NETPERF_SYNCER_SECRET: ${{ inputs.syncer-secret }}
      NETPERF_GITHUB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NETPERF_LOG_PROFILE: ${{ inputs.log-profile }}
      NETPERF_MSQUIC_COMMIT: ${{ inputs.msquic-commit }}
      NETPERF_ENVIRONMENT: ${{ inputs.environment }}
      NETPERF_PLATFORM: ${{ inputs.platform }}
      NETPERF_OS: ${{ inputs.os }}
      NETPERF_ARCH: ${{ inputs.arch }}
      NETPERF_TLS: ${{ inputs.tls }}
      NETPERF_IO: ${{ inputs.io }}
      NETPERF_FILTER: ${{ inputs.filter }}
    run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\netperfrepo\.github\actions\run-test-script\run-test-script.ps1"
  - name: Run PowerShell test script
    if: ${{ env.HAS_PWSH == 'true' }}
    shell: pwsh
    env:
      NETPERF_MATRIX: ${{ inputs.matrix }}
      NETPERF_SYNCER_SECRET: ${{ inputs.syncer-secret }}
      NETPERF_GITHUB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NETPERF_LOG_PROFILE: ${{ inputs.log-profile }}
      NETPERF_MSQUIC_COMMIT: ${{ inputs.msquic-commit }}
      NETPERF_ENVIRONMENT: ${{ inputs.environment }}
      NETPERF_PLATFORM: ${{ inputs.platform }}
      NETPERF_OS: ${{ inputs.os }}
      NETPERF_ARCH: ${{ inputs.arch }}
      NETPERF_TLS: ${{ inputs.tls }}
      NETPERF_IO: ${{ inputs.io }}
      NETPERF_FILTER: ${{ inputs.filter }}
    run: ./netperfrepo/.github/actions/run-test-script/run-test-script.ps1
