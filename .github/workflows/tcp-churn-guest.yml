name: TCP churn netperf guest
on:
  workflow_dispatch:
    inputs:
      probe_128_topology:
        description: Boot and remove an isolated diskless 128-vCPU VM; no existing guest changes
        type: boolean
        default: false
      topology_vcpus:
        description: Processor count for isolated topology probe (80 for control, 128 for target)
        type: string
        default: '128'
      profile_cpu:
        description: Collect guest-local CPU stacks and publish public-symbol aggregates
        type: boolean
        default: false
      seconds:
        type: string
        default: '30'
      connections:
        type: string
        default: '256'
      syn_drop:
        description: Scoped silent SYN-drop outage (not PMTU probing)
        type: boolean
        default: false
      probe_peer:
        description: Check idle netperf peer connectivity without traffic or faults
        type: boolean
        default: false
      peer_measurement:
        description: Measure over the actual idle netperf peer instead of single-host DuoNIC
        type: boolean
        default: false
  push:
    branches: ['user/mtfriesen/tcp-churn-public']
    paths: ['.github/workflows/tcp-churn-guest.yml']
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-TcpChurn.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-HyperVTopologyProbe.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-RssControl.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-HealthyParallel.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-HealthyEvidence.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-EstablishedTransfer.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-BarrierTcp.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-ArrivalTcp.ps1
  build-analyzer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_cpu }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build new analyzer from public source only
        shell: pwsh
        run: |
          dotnet publish ./experiments/tcp-churn/CpuSamples/CpuSamples.csproj -c Release -o ./analyzer
          if ($LASTEXITCODE) { throw 'Analyzer build failed.' }
          ./analyzer/CpuSamples.exe --self-test
          if ($LASTEXITCODE) { throw 'Analyzer self-test failed.' }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: public-source-cpu-analyzer
          path: analyzer/
          retention-days: 7
  guest-smoke:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.source-tests.result == 'success' && (needs.build-analyzer.result == 'success' || needs.build-analyzer.result == 'skipped') }}
    needs: [source-tests, build-analyzer]
    # Same documented management slot as the targeted lab reset workflow.
    runs-on: [self-hosted, 'parent=rr1-netperf-26\localadminuser']
    timeout-minutes: 15
    concurrency:
      group: tcp-churn-netperf-guest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        if: ${{ inputs.profile_cpu }}
        with:
          name: public-source-cpu-analyzer
          path: analyzer
      - name: Run inside the existing idle lab VM
        shell: powershell
        env:
          GUEST_USER: ${{ secrets.VM_DUMMY_USERNAME }}
          GUEST_PASSWORD: ${{ secrets.VM_DUMMY_PASSWORD }}
          PROFILE_CPU: ${{ inputs.profile_cpu }}
          SECONDS: ${{ inputs.seconds }}
          CONNECTIONS: ${{ inputs.connections }}
          SYN_DROP: ${{ inputs.syn_drop }}
          PROBE_PEER: ${{ inputs.probe_peer }}
          PEER_MEASUREMENT: ${{ inputs.peer_measurement }}
          PROBE_128_TOPOLOGY: ${{ inputs.probe_128_topology }}
          TOPOLOGY_VCPUS: ${{ inputs.topology_vcpus }}
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "tcp-churn-guest-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:PROBE_128_TOPOLOGY -eq 'true') {
            if (Test-Path Env:\GUEST_PASSWORD) { Remove-Item Env:\GUEST_PASSWORD }
            if (Test-Path Env:\GUEST_USER) { Remove-Item Env:\GUEST_USER }
            if ($env:PROFILE_CPU -eq 'true' -or $env:SYN_DROP -eq 'true' -or $env:PEER_MEASUREMENT -eq 'true' -or $env:PROBE_PEER -eq 'true') {
              throw 'Topology probing is separate from traffic and profiling.'
            }
            ./experiments/tcp-churn/adapters/Invoke-HyperVTopologyProbe.ps1 `
              -PublishDirectory $publish -ReferenceVmName netperf-windows-2022-client -ProcessorCount ([int]$env:TOPOLOGY_VCPUS)
            return
          }
          if (!$env:GUEST_USER -or !$env:GUEST_PASSWORD) { throw 'Configured VM credentials are required.' }
          $password = ConvertTo-SecureString $env:GUEST_PASSWORD -AsPlainText -Force
          $credential = [pscredential]::new($env:GUEST_USER, $password)
          Remove-Item Env:\GUEST_PASSWORD
          $publish = Join-Path $env:RUNNER_TEMP "tcp-churn-guest-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $extra = @{}
          if ($env:PROFILE_CPU -eq 'true') {
            $extra.ProfileCpu = $true
            $extra.AnalyzerDirectory = Join-Path $env:GITHUB_WORKSPACE 'analyzer'
          }
          if ($env:SYN_DROP -eq 'true') {
            if ($env:PROFILE_CPU -ne 'true') { throw 'SYN-drop measurement requires CPU profiling.' }
            $extra.SynDrop = $true
          }
          if ($env:PROBE_PEER -eq 'true') { $extra.ProbePeer = $true }
          if ($env:PEER_MEASUREMENT -eq 'true') {
            if ($env:PROFILE_CPU -ne 'true') { throw 'Peer measurement requires CPU profiling.' }
            $extra.PeerMeasurement = $true
          }
          ./experiments/tcp-churn/adapters/Invoke-NetperfGuestTcpChurn.ps1 `
            -VmName netperf-windows-2022-client -Credential $credential `
            -PublishDirectory $publish -Seconds ([int]$env:SECONDS) -Connections ([int]$env:CONNECTIONS) @extra
      - name: Publish numeric result only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: tcp-churn-guest-result
          path: |
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-idle.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-load.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-progress.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/tcp-state.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/tcp-events.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/peer-check.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/lock-evidence.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/topology-check.json
          if-no-files-found: warn
          retention-days: 14
