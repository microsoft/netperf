name: TCP churn netperf guest
on:
  workflow_dispatch:
    inputs:
      probe_128_topology:
        description: Boot and remove an isolated diskless 128-vCPU VM; no existing guest changes
        type: boolean
        default: false
      topology_vcpus:
        description: Processor count for isolated topology probe (80 for control, 128 for target)
        type: string
        default: '128'
      profile_cpu:
        description: Collect guest-local CPU stacks and publish public-symbol aggregates
        type: boolean
        default: false
      seconds:
        type: string
        default: '30'
      connections:
        type: string
        default: '256'
      syn_drop:
        description: Scoped silent SYN-drop outage (not PMTU probing)
        type: boolean
        default: false
      probe_peer:
        description: Check idle netperf peer connectivity without traffic or faults
        type: boolean
        default: false
      peer_measurement:
        description: Measure over the actual idle netperf peer instead of single-host DuoNIC
        type: boolean
        default: false
      managed_gc_mixed:
        description: Run bounded managed-GC/mixed TCP diagnostic on existing idle guests (requires CPU profiling)
        type: boolean
        default: false
      managed_gc_payload_bytes:
        description: Request and response bytes for the managed-GC diagnostic only
        type: choice
        options: ['1460', '2048', '65536', '1048576']
        default: '65536'
      managed_gc_peer_recovery:
        description: Add a bounded owned-peer neighbor outage after established traffic (managed-GC mode only)
        type: boolean
        default: false
      managed_gc_isolated_data:
        description: Add owned temporary data aliases on already-static guest interfaces, preserving management
        type: boolean
        default: false
      managed_gc_recovery_ms:
        description: Verified stale-neighbor hold time; requires managed-GC peer recovery
        type: choice
        options: ['3000', '5000', '8000']
        default: '8000'
      managed_gc_process_role:
        description: Paused process; server requires isolated data and no neighbor pulse
        type: choice
        options: ['client', 'server']
        default: 'client'
      managed_gc_heap_layout:
        description: Bounded GC pressure layout; graph uses same nominal heap budget with many linked objects
        type: choice
        options: ['arrays', 'graph']
        default: 'arrays'
  push:
    branches: [main, 'user/mtfriesen/tcp-churn-public']
    paths: ['.github/workflows/tcp-churn-guest.yml', 'experiments/tcp-churn/**']
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-TcpChurn.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-HyperVTopologyProbe.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-RssControl.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-HealthyParallel.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-HealthyEvidence.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-EstablishedTransfer.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-BarrierTcp.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-ArrivalTcp.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-GcArrivalTcp.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-ServerGcArrivalTcp.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-ServerGcArrivalTcp.ps1 -HeapLayout graph
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-GcGuestAdapter.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-ScopedNeighborPulse.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-ScopedDataAddresses.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-TcpRecoveryEvidence.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-CpuUtilization.ps1
      - shell: pwsh
        run: ./experiments/tcp-churn/Test-CpuCollector.ps1
  build-analyzer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_cpu }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build new analyzer from public source only
        shell: pwsh
        run: |
          dotnet publish ./experiments/tcp-churn/CpuSamples/CpuSamples.csproj -c Release -o ./analyzer
          if ($LASTEXITCODE) { throw 'Analyzer build failed.' }
          ./analyzer/CpuSamples.exe --self-test
          if ($LASTEXITCODE) { throw 'Analyzer self-test failed.' }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: public-source-cpu-analyzer
          path: analyzer/
          retention-days: 7
  guest-smoke:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.source-tests.result == 'success' && (needs.build-analyzer.result == 'success' || needs.build-analyzer.result == 'skipped') }}
    needs: [source-tests, build-analyzer]
    # Same documented management slot as the targeted lab reset workflow.
    runs-on: [self-hosted, 'parent=rr1-netperf-26\localadminuser']
    timeout-minutes: 15
    concurrency:
      group: tcp-churn-netperf-guest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        if: ${{ inputs.profile_cpu }}
        with:
          name: public-source-cpu-analyzer
          path: analyzer
      - name: Run inside the existing idle lab VM
        shell: powershell
        env:
          GUEST_USER: ${{ secrets.VM_DUMMY_USERNAME }}
          GUEST_PASSWORD: ${{ secrets.VM_DUMMY_PASSWORD }}
          PROFILE_CPU: ${{ inputs.profile_cpu }}
          SECONDS: ${{ inputs.seconds }}
          CONNECTIONS: ${{ inputs.connections }}
          SYN_DROP: ${{ inputs.syn_drop }}
          PROBE_PEER: ${{ inputs.probe_peer }}
          PEER_MEASUREMENT: ${{ inputs.peer_measurement }}
          PROBE_128_TOPOLOGY: ${{ inputs.probe_128_topology }}
          TOPOLOGY_VCPUS: ${{ inputs.topology_vcpus }}
          MANAGED_GC_MIXED: ${{ inputs.managed_gc_mixed }}
          MANAGED_GC_PAYLOAD_BYTES: ${{ inputs.managed_gc_payload_bytes }}
          MANAGED_GC_PEER_RECOVERY: ${{ inputs.managed_gc_peer_recovery }}
          MANAGED_GC_ISOLATED_DATA: ${{ inputs.managed_gc_isolated_data }}
          MANAGED_GC_RECOVERY_MS: ${{ inputs.managed_gc_recovery_ms }}
          MANAGED_GC_PROCESS_ROLE: ${{ inputs.managed_gc_process_role }}
          MANAGED_GC_HEAP_LAYOUT: ${{ inputs.managed_gc_heap_layout }}
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "tcp-churn-guest-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:PROBE_128_TOPOLOGY -eq 'true') {
            if (Test-Path Env:\GUEST_PASSWORD) { Remove-Item Env:\GUEST_PASSWORD }
            if (Test-Path Env:\GUEST_USER) { Remove-Item Env:\GUEST_USER }
            if ($env:PROFILE_CPU -eq 'true' -or $env:SYN_DROP -eq 'true' -or $env:PEER_MEASUREMENT -eq 'true' -or $env:PROBE_PEER -eq 'true' -or $env:MANAGED_GC_MIXED -eq 'true' -or $env:MANAGED_GC_PEER_RECOVERY -eq 'true' -or $env:MANAGED_GC_ISOLATED_DATA -eq 'true' -or $env:MANAGED_GC_RECOVERY_MS -ne '8000' -or $env:MANAGED_GC_PROCESS_ROLE -ne 'client' -or $env:MANAGED_GC_HEAP_LAYOUT -ne 'arrays') {
              throw 'Topology probing is separate from traffic and profiling.'
            }
            ./experiments/tcp-churn/adapters/Invoke-HyperVTopologyProbe.ps1 `
              -PublishDirectory $publish -ReferenceVmName netperf-windows-2022-client -ProcessorCount ([int]$env:TOPOLOGY_VCPUS)
            return
          }
          if (!$env:GUEST_USER -or !$env:GUEST_PASSWORD) { throw 'Configured VM credentials are required.' }
          $password = ConvertTo-SecureString $env:GUEST_PASSWORD -AsPlainText -Force
          $credential = [pscredential]::new($env:GUEST_USER, $password)
          Remove-Item Env:\GUEST_PASSWORD
          $publish = Join-Path $env:RUNNER_TEMP "tcp-churn-guest-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $extra = @{}
          if ($env:PROFILE_CPU -eq 'true') {
            $extra.ProfileCpu = $true
            $extra.AnalyzerDirectory = Join-Path $env:GITHUB_WORKSPACE 'analyzer'
          }
          if ($env:SYN_DROP -eq 'true') {
            if ($env:PROFILE_CPU -ne 'true') { throw 'SYN-drop measurement requires CPU profiling.' }
            $extra.SynDrop = $true
          }
          if ($env:PROBE_PEER -eq 'true') { $extra.ProbePeer = $true }
          if ($env:PEER_MEASUREMENT -eq 'true') {
            if ($env:PROFILE_CPU -ne 'true') { throw 'Peer measurement requires CPU profiling.' }
            $extra.PeerMeasurement = $true
          }
          if ($env:MANAGED_GC_MIXED -eq 'true') {
            if ($env:PROFILE_CPU -ne 'true' -or $env:SYN_DROP -eq 'true' -or $env:PEER_MEASUREMENT -eq 'true' -or $env:PROBE_PEER -eq 'true') {
              throw 'Managed-GC diagnostics require CPU profiling and are separate from other campaigns.'
            }
            $extra.ManagedGc = $true
            $extra.ManagedGcPayloadBytes = [int]$env:MANAGED_GC_PAYLOAD_BYTES
            $extra.ManagedGcProcessRole = $env:MANAGED_GC_PROCESS_ROLE
            $extra.ManagedGcHeapLayout = $env:MANAGED_GC_HEAP_LAYOUT
          }
          if ($env:MANAGED_GC_PEER_RECOVERY -eq 'true') {
            if ($env:MANAGED_GC_MIXED -ne 'true') { throw 'Peer recovery requires managed-GC diagnostic mode.' }
            $extra.ManagedGcPeerRecovery = $true
            $extra.ManagedGcRecoveryMilliseconds = [int]$env:MANAGED_GC_RECOVERY_MS
          }
          if ($env:MANAGED_GC_ISOLATED_DATA -eq 'true') {
            if ($env:MANAGED_GC_MIXED -ne 'true') { throw 'Isolated data addresses require managed-GC diagnostic mode.' }
            $extra.ManagedGcIsolatedData = $true
          }
          if ($env:MANAGED_GC_RECOVERY_MS -ne '8000' -and $env:MANAGED_GC_PEER_RECOVERY -ne 'true') {
            throw 'Recovery duration selection requires managed-GC peer recovery.'
          }
          if ($env:MANAGED_GC_PROCESS_ROLE -ne 'client' -and $env:MANAGED_GC_MIXED -ne 'true') {
            throw 'Receiver GC requires managed-GC diagnostic mode.'
          }
          if ($env:MANAGED_GC_HEAP_LAYOUT -ne 'arrays' -and $env:MANAGED_GC_MIXED -ne 'true') {
            throw 'GC heap layout selection requires managed-GC diagnostic mode.'
          }
          ./experiments/tcp-churn/adapters/Invoke-NetperfGuestTcpChurn.ps1 `
            -VmName netperf-windows-2022-client -Credential $credential `
            -PublishDirectory $publish -Seconds ([int]$env:SECONDS) -Connections ([int]$env:CONNECTIONS) @extra
      - name: Publish numeric result only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: tcp-churn-guest-result
          path: |
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-idle.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-load.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-after-gc.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-after-recovery.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/clr-events.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/cpu-progress.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/tcp-state.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/tcp-events.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/peer-check.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/lock-evidence.json
            ${{ runner.temp }}/tcp-churn-guest-${{ github.run_id }}-${{ github.run_attempt }}/topology-check.json
          if-no-files-found: warn
          retention-days: 14
